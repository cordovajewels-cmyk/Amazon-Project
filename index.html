<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Amazon Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/shared/amazon-header.css" />
    <link rel="stylesheet" href="styles/pages/amazon.css" />
  </head>

  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <img
            class="amazon-logo"
            src="images/amazon-logo-white.png"
            alt="Amazon"
          />
          <img
            class="amazon-mobile-logo"
            src="images/amazon-mobile-logo-white.png"
            alt="Amazon"
          />
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar" type="text" placeholder="Search" />
        <button class="search-button">
          <img
            class="search-icon"
            src="images/icons/search-icon.png"
            alt="Search"
          />
        </button>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">&amp; Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png" alt="Cart" />
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
      <!-- closes amazon-header-right-section -->
    </div>
    <!-- closes amazon-header -->

    <div class="main">
      <div class="products-grid js-products-grid"></div>
    </div>

    <script src="data/products.js"></script>
    <script type="module" src="scripts/amazon.js"></script>
    <!-- type="module" LET'S THIS FILE GET VARIABLES OUT OF OTHER FILES -->
    <!-- IN ORDER TO USE MODULES, HAVE TO USE LIVE SERVER -->
    <!-- MODULES HELP AVOID NAMING CONFLICTS -->
    <!-- USING MODULES WE DON'T HAVE TO WORRY ABOUT THE ORDER OF THE FILES -->
  </body>
</html>
